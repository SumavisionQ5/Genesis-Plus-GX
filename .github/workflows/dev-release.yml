name: CI Switch/libnx

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: git.libretro.com:5050/libretro-infrastructure/libretro-build-libnx-devkitpro:latest
      options: --user root

    steps:
    - uses: actions/checkout@v4
    
    - name: Compile core
      run: |
        make -f Makefile.libretro clean
        make -f Makefile.libretro -j$(getconf _NPROCESSORS_ONLN) "platform=libnx"
    
    - uses: actions/upload-artifact@v3
      with:
        name: Binary_File
        path: |
          ./genesis_plus_gx_libretro_libnx.a
